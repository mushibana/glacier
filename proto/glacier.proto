edition = "2024";

package glacier;

option go_package = "github.com/mushibana/glacier/proto/glacier";

option java_package = "io.github.mushibana.glacier.proto";
option java_multiple_files = true;

message Empty {}

message Task {
  int64 id = 1;
  string name = 2;
  int64 order_num = 3;
}

service Tasks {
  rpc CreateTask(CreateTaskRequest) returns (Task) {}
  rpc GetTasks(GetTasksRequest) returns (GetTasksResponse) {}
  rpc UpdateTaskOrder(UpdateTaskOrderRequest) returns (Empty) {}
  rpc ReorderTasks(ReorderTasksRequest) returns (Empty) {}
}

// requests

message CreateTaskRequest {
  string name = 2;
  int64 order_num = 3;
}

message GetTasksRequest {}

message UpdateTaskOrderRequest {
  int64 id = 1;
  int64 order_num = 2;
}

message ReorderTasksRequest {
  message Task {
    int64 id = 1
    int64 order_num = 2;
  }

  repeated Task tasks = 1;
}

// responses

message GetTasksResponse {
  repeated Task tasks = 1;
}
