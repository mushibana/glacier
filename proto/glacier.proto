syntax = "proto3";

package glacier;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mushibana/glacier/backend/proto";

option java_package = "io.github.mushibana.glacier.proto";
option java_multiple_files = true;


// services

service Tasks {
  rpc ListTasks(google.protobuf.Empty) returns (ListTasksResponse) {}
  rpc CreateTask(CreateTaskRequest) returns (Task) {}
  rpc GetTask(GetTaskRequest) returns (Task) {}
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {}
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty) {}
  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse) {}
}


// resources

message Task {
  int64 id = 1;
  optional int64 parent_id = 2;
  string name = 3;
  optional string description = 4;
  optional int64 stream_id = 5;
  optional google.protobuf.Timestamp start_at = 6;
  optional google.protobuf.Timestamp deadline_at = 7;
  optional int64 timelimit = 8;
  optional bool is_onetime = 9;
  optional bool repeatable = 10;
  optional bool finished = 11;
  google.protobuf.Timestamp created_at = 12;
  optional google.protobuf.Timestamp updated_at = 13;
}

message ListTaskEntry {
  int64 id = 1;
  optional int64 parent_id = 2;
  string name = 3;
  int64 order_num = 4;
}


// requests

message CreateTaskRequest {
  string name = 1;
  optional int64 parent_id = 2;
  optional int64 stream_id = 3;
}

message GetTaskRequest {
  int64 id = 1;
}

message UpdateTaskRequest {
  Task task = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteTaskRequest {
  int64 id = 1;
}

message MoveTaskRequest {
  int64 id = 1;
  optional int64 before_task_id = 2;
}


// responses

message ListTasksResponse {
  repeated ListTaskEntry tasks = 1;
}

message UpdateTaskResponse {
  int64 id = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message MoveTaskResponse {
  repeated ListTaskEntry changed_tasks = 1;
}
